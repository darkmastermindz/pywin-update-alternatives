name: Windows Launcher Tests

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]

jobs:
  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run launcher smoke tests
        env:
          PYWIN_UPDATE_ALTERNATIVES_PYTHON: ${{ env.pythonLocation }}\python.exe
        run: python -m unittest tests.test_launchers -v
